    <script>
      const weddingMonth = 7;
      const weddingDay = 28;
      const today = new Date();
      const start = new Date(today.getFullYear(), today.getMonth(), today.getDate());
      let year = start.getFullYear();
      if (start > new Date(year, weddingMonth, weddingDay)) year += 1;
      const wedding = new Date(year, weddingMonth, weddingDay);
      const days = Math.round((wedding - start) / 86400000);
      const count = document.querySelector("#days");
      const label = document.querySelector("#days-label");
      count.textContent = String(days);
      label.textContent = days === 1 ? "day" : "days";
      count.closest(".countdown").setAttribute(
        "aria-label",
        days === 0 ? "The wedding is today" : `${days} ${label.textContent} until August 28`
      );

      const film = document.querySelector(".welcome-film");
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        film.removeAttribute("autoplay");
        film.pause();
      }
    </script>
