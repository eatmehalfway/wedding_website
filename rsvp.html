<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RSVP — Amelia and Patrick</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Pinyon+Script&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="src/styles/tokens.css" />
    <link rel="stylesheet" href="src/styles/site.css" />
  </head>
  <body>
    <header class="site-header">
      <nav class="nav" aria-label="Pages">
        <a class="mark" href="index.html">A<span class="sep" aria-hidden="true"></span>P</a>
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="story.html">Our Story</a></li>
          <li><a href="stay.html">Stay</a></li>
          <li><a href="schedule.html">Schedule</a></li>
          <li><a href="rsvp.html" aria-current="page">RSVP</a></li>
          <li><a href="faq.html">FAQ</a></li>
        </ul>
      </nav>
    </header>

    <main class="reply">
      <h2>RSVP</h2>
      <p>A note is enough. Replies gather in the list below, and stay on this page for now.</p>

      <div class="ledger-wrap">
        <table class="ledger">
          <thead>
            <tr>
              <th scope="col">Name</th>
              <th scope="col">Reply</th>
              <th scope="col">Note</th>
            </tr>
          </thead>
          <tbody id="ledger-body">
            <tr class="ledger-empty">
              <td colspan="3">No replies yet.</td>
            </tr>
          </tbody>
        </table>
      </div>

      <p class="reply-add">Add a reply</p>
      <form id="reply-form">
        <label>
          Your name
          <input name="name" type="text" required autocomplete="name" />
        </label>
        <label>
          Attending
          <select name="attending">
            <option>Joyfully accepts</option>
            <option>Regretfully declines</option>
          </select>
        </label>
        <label>
          A note
          <textarea name="note"></textarea>
        </label>
        <button class="button" type="submit">Send reply</button>
      </form>
      <p class="confirm" id="reply-confirm" hidden>
        Thank you. Your reply is held on this page for now.
      </p>
      <div class="herb-row" aria-hidden="true">
        <img src="src/ornament/herbs/pansy.png" alt="" />
        <img src="src/ornament/herbs/foliage.png" alt="" />
        <img src="src/ornament/herbs/bunch.png" alt="" />
      </div>
    </main>
    <script>
      const form = document.querySelector("#reply-form");
      const confirm = document.querySelector("#reply-confirm");
      const ledger = document.querySelector("#ledger-body");

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        const data = new FormData(form);
        const name = String(data.get("name") || "").trim();
        const attending = String(data.get("attending") || "").trim();
        const note = String(data.get("note") || "").trim();
        ledger.querySelector(".ledger-empty")?.remove();
        const row = document.createElement("tr");
        for (const value of [name, attending, note || "—"]) {
          const cell = document.createElement("td");
          cell.textContent = value;
          row.append(cell);
        }
        ledger.append(row);
        confirm.textContent = `Thank you, ${name}. Your reply is on the list, and only on this page for now.`;
        confirm.hidden = false;
        form.reset();
      });
    </script>
  </body>
</html>
